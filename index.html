<!DOCTYPE html>
<html ng-app="employeeApp" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Employees</title>
  <link rel="stylesheet" href="styles/output.css">
</head>
<body ng-controller="MainController">
  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-2xl font-semibold mb-6">Company employees</h1>
    <div class="overflow-x-auto rounded border border-gray-200">
      <table class="w-full text-sm">
        <thead class="bg-gray-100 text-left text-gray-500 uppercase text-xs tracking-wide">
          <tr>
            <th class="border-b border-gray-200 px-4 py-3">ID_USER</th>
            <th class="border-b border-gray-200 px-4 py-3">NAME</th>
            <th class="border-b border-gray-200 px-4 py-3">USERNAME</th>
            <th class="border-b border-gray-200 px-4 py-3">EMAIL</th>
          </tr>
        </thead>
        <tbody>
          <tr
            ng-repeat="user in users"
            ng-class="{
              'bg-blue-100': selectedUser && selectedUser.id === user.id,
              'bg-gray-50': $odd && !(selectedUser && selectedUser.id === user.id),
              'bg-white': $even && !(selectedUser && selectedUser.id === user.id)
            }"
            ng-click="selectUser(user)"
            on-long-press
            class="cursor-pointer border-b border-gray-100">
            <td class="px-4 py-3">{{ user.id }}</td>
            <td class="px-4 py-3">{{ user.name }}</td>
            <td class="px-4 py-3">{{ user.username }}</td>
            <td class="px-4 py-3">{{ user.email }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <user-details
    ng-if="selectedUser"
    user="selectedUser"
    on-delete="deleteUser(userId)"
    on-close="closeDetails()">
  </user-details>

  <!-- Pre-cache component templates so there is no HTTP delay on first open -->
  <script type="text/ng-template" id="app/components/popup/popup.template.html">
    <div ng-if="$ctrl.isOpen" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
      <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4">
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <span class="font-semibold text-gray-800">{{ $ctrl.title }}</span>
          <button
            type="button"
            ng-click="$ctrl.onClose()"
            class="text-gray-400 hover:text-gray-600 text-2xl leading-none transition-colors">&times;</button>
        </div>
        <div class="px-6 py-4">
          <ng-transclude></ng-transclude>
        </div>
      </div>
    </div>
  </script>

  <script type="text/ng-template" id="app/components/user-details/user-details.template.html">
    <popup title="User details" is-open="true" on-close="$ctrl.onClose()">
      <div class="grid grid-cols-3 gap-4 mb-5">
        <div class="min-w-0">
          <div class="text-xs text-gray-500 mb-1">Username</div>
          <div class="font-semibold text-gray-800 truncate">{{ $ctrl.user.username }}</div>
        </div>
        <div class="min-w-0">
          <div class="text-xs text-gray-500 mb-1">Name</div>
          <div class="font-semibold text-gray-800 truncate">{{ $ctrl.user.name }}</div>
        </div>
        <div class="min-w-0">
          <div class="text-xs text-gray-500 mb-1">Email</div>
          <div class="font-semibold text-gray-800 truncate" title="{{ $ctrl.user.email }}">{{ $ctrl.user.email }}</div>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4 mb-5">
        <div>
          <div class="text-xs text-gray-500 mb-1">Website</div>
          <div class="font-semibold text-gray-800">{{ $ctrl.user.website }}</div>
        </div>
        <div>
          <div class="text-xs text-gray-500 mb-1">Phone number</div>
          <div class="font-semibold text-gray-800">{{ $ctrl.user.phone }}</div>
        </div>
      </div>
      <div class="mb-5">
        <div class="text-xs text-gray-500 mb-1">Address</div>
        <div class="text-sm text-gray-700">Street: {{ $ctrl.user.address.street }}</div>
        <div class="text-sm text-gray-700">Suite: {{ $ctrl.user.address.suite }}</div>
        <div class="text-sm text-gray-700">City: {{ $ctrl.user.address.city }}</div>
        <div class="text-sm text-gray-700">Zip Code: {{ $ctrl.user.address.zipcode }}</div>
      </div>
      <div class="flex justify-end">
        <button
          type="button"
          ng-click="$ctrl.confirmDelete()"
          class="bg-red-600 hover:bg-red-700 text-white p-2 rounded transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </popup>
    <popup title="Alert" is-open="$ctrl.showDeleteConfirm" on-close="$ctrl.cancelDelete()">
      <p class="text-gray-700 mb-5">Are you sure you want to delete this record?</p>
      <div class="flex justify-end gap-4">
        <button
          type="button"
          ng-click="$ctrl.cancelDelete()"
          class="text-gray-500 hover:text-gray-800 font-medium transition-colors">No</button>
        <button
          type="button"
          ng-click="$ctrl.doDelete()"
          class="text-red-600 hover:text-red-800 font-medium transition-colors">Yes</button>
      </div>
    </popup>
  </script>

  <script src="node_modules/angular/angular.min.js"></script>
  <script src="app/app.module.js"></script>
  <script src="app/factories/users.factory.js"></script>
  <script src="app/directives/on-long-press.directive.js"></script>
  <script src="app/components/popup/popup.component.js"></script>
  <script src="app/components/user-details/user-details.component.js"></script>
  <script src="app/app.controller.js"></script>
</body>
</html>
