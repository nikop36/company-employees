<!DOCTYPE html>
<html ng-app="employeeApp" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Employees</title>
  <link rel="stylesheet" href="styles/output.css">
</head>
<body ng-controller="MainController">
  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-2xl font-semibold mb-6">Company employees</h1>
    <div class="overflow-x-auto rounded border border-gray-200">
      <table class="w-full text-sm">
        <thead class="bg-gray-100 text-left text-gray-500 uppercase text-xs tracking-wide">
          <tr>
            <th class="border-b border-gray-200 px-4 py-3">ID_USER</th>
            <th class="border-b border-gray-200 px-4 py-3">NAME</th>
            <th class="border-b border-gray-200 px-4 py-3">USERNAME</th>
            <th class="border-b border-gray-200 px-4 py-3">EMAIL</th>
          </tr>
        </thead>
        <tbody>
          <tr
            ng-repeat="user in users"
            ng-class="{
              'bg-blue-100': selectedUser && selectedUser.id === user.id,
              'bg-gray-50': $odd && !(selectedUser && selectedUser.id === user.id),
              'bg-white': $even && !(selectedUser && selectedUser.id === user.id)
            }"
            ng-click="selectUser(user)"
            on-long-press
            class="cursor-pointer border-b border-gray-100">
            <td class="px-4 py-3">{{ user.id }}</td>
            <td class="px-4 py-3">{{ user.name }}</td>
            <td class="px-4 py-3">{{ user.username }}</td>
            <td class="px-4 py-3">{{ user.email }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <user-details
    ng-if="selectedUser"
    user="selectedUser"
    on-delete="deleteUser(userId)"
    on-close="closeDetails()">
  </user-details>

  <script src="node_modules/angular/angular.min.js"></script>
  <script src="app/app.module.js"></script>
  <script src="app/factories/users.factory.js"></script>
  <script src="app/directives/on-long-press.directive.js"></script>
  <script src="app/components/popup/popup.component.js"></script>
  <script src="app/components/user-details/user-details.component.js"></script>
  <script src="app/app.controller.js"></script>
</body>
</html>
